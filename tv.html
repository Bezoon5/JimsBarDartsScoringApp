<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fd:"Alfa Slab One",Rockwell,"American Typewriter",Georgia,serif;
  --ft:"Zilla Slab",Rockwell,"American Typewriter",Georgia,serif;
  --red:#AA0000;--red2:#7d0000;--red3:#5c0000;--gold:#B3995D;--goldl:#d8bf87;--goldd:#8a7140;
  --black:#121212;--char:#1e1e1e;--char2:#2a2a2a;--cream:#fff8ec;--cream2:#f3e7cf;--ink:#121212;--mute:#8d7a58;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--black);color:var(--ink);font-family:var(--ft);font-weight:600;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.hidden{display:none!important}
button{font-family:var(--ft);font-weight:700;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation;text-transform:uppercase;letter-spacing:.02em}
input,select{font-family:var(--ft);font-size:19px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--gold);border-radius:10px;padding:10px 12px;width:100%;-webkit-user-select:text;user-select:text}
select{appearance:none;-webkit-appearance:none;background:#fff none no-repeat right 12px center}
/* outlined slab lettering (gold inner line, black outer line) */
.ol{font-family:var(--fd);font-weight:400;color:var(--cream);text-shadow:0.030em 0.000em 0 #B3995D, 0.026em 0.015em 0 #B3995D, 0.015em 0.026em 0 #B3995D, 0.000em 0.030em 0 #B3995D, -0.015em 0.026em 0 #B3995D, -0.026em 0.015em 0 #B3995D, -0.030em 0.000em 0 #B3995D, -0.026em -0.015em 0 #B3995D, -0.015em -0.026em 0 #B3995D, -0.000em -0.030em 0 #B3995D, 0.015em -0.026em 0 #B3995D, 0.026em -0.015em 0 #B3995D, 0.070em 0.000em 0 #121212, 0.065em 0.027em 0 #121212, 0.049em 0.049em 0 #121212, 0.027em 0.065em 0 #121212, 0.000em 0.070em 0 #121212, -0.027em 0.065em 0 #121212, -0.049em 0.049em 0 #121212, -0.065em 0.027em 0 #121212, -0.070em 0.000em 0 #121212, -0.065em -0.027em 0 #121212, -0.049em -0.049em 0 #121212, -0.027em -0.065em 0 #121212, -0.000em -0.070em 0 #121212, 0.027em -0.065em 0 #121212, 0.049em -0.049em 0 #121212, 0.065em -0.027em 0 #121212, 0 .1em 0 #121212, 0 .14em .12em rgba(0,0,0,.45)}
.olg{font-family:var(--fd);font-weight:400;color:var(--gold);text-shadow:0.050em 0.000em 0 #121212, 0.045em 0.022em 0 #121212, 0.031em 0.039em 0 #121212, 0.011em 0.049em 0 #121212, -0.011em 0.049em 0 #121212, -0.031em 0.039em 0 #121212, -0.045em 0.022em 0 #121212, -0.050em 0.000em 0 #121212, -0.045em -0.022em 0 #121212, -0.031em -0.039em 0 #121212, -0.011em -0.049em 0 #121212, 0.011em -0.049em 0 #121212, 0.031em -0.039em 0 #121212, 0.045em -0.022em 0 #121212, 0 .08em 0 #121212}
.ols{font-family:var(--fd);font-weight:400;color:var(--cream);text-shadow:1.200px 0.000px 0 #121212, 0.971px 0.705px 0 #121212, 0.371px 1.141px 0 #121212, -0.371px 1.141px 0 #121212, -0.971px 0.705px 0 #121212, -1.200px 0.000px 0 #121212, -0.971px -0.705px 0 #121212, -0.371px -1.141px 0 #121212, 0.371px -1.141px 0 #121212, 0.971px -0.705px 0 #121212, 0 2px 0 #121212}
.fd{font-family:var(--fd);font-weight:400}

/* ======= FRONT PAGE ======= */
#splash{position:fixed;inset:0;overflow:hidden;background:var(--black);z-index:30;transition:opacity .45s,transform .45s;display:flex;flex-direction:column}
#splash.go{opacity:0;transform:translateY(3%);pointer-events:none}
.fp-art{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(180deg,rgba(40,22,6,.1),rgba(40,22,6,.35)),repeating-linear-gradient(90deg,#3a230e 0 7px,#9a6a2a 7px 9px,#c9963f 9px 24px,#b07d33 24px 28px)}
.fp-img{position:absolute;inset:0;background:none center top/cover no-repeat}
.fp-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(180deg,rgba(18,18,18,0),rgba(18,18,18,.55));pointer-events:none}
.musicbtn{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);width:48px;height:48px;border-radius:50%;background:var(--gold);border:3px solid var(--black);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.musicbtn svg{width:24px;height:24px}.musicbtn .mx{display:none}.musicbtn:not(.on):not(.invite) .mx{display:inline}
.musicbtn.invite{animation:pulse2 1.6s ease-in-out infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(179,153,93,.8),0 4px 12px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 12px rgba(179,153,93,0),0 4px 12px rgba(0,0,0,.45)}}
.musicbtn.on{background:var(--cream)}
.fp-panel{position:relative;flex:0 0 auto;background:var(--red);z-index:2;border-top:5px solid var(--black);box-shadow:0 -4px 0 var(--gold),0 -12px 30px rgba(0,0,0,.4)}
.fp-title{position:relative;text-align:center;padding:min(16px,2vh) 14px min(8px,1vh)}
.fp-title small{display:block;font-size:clamp(20px,min(7vw,4.6vh),44px);letter-spacing:.12em;line-height:1.05}
.fp-title b{display:block;font-size:clamp(34px,min(12vw,8vh),100px);line-height:1.05;margin-top:2px}
.fp-strip{background:var(--black);color:var(--gold);text-align:center;font-size:clamp(14px,4vw,20px);padding:6px 8px;text-transform:uppercase;letter-spacing:.14em;white-space:nowrap;overflow:hidden;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.fp-body{padding:min(12px,1.5vh) 14px calc(min(16px,2vh) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.fp-play{width:100%;background:var(--gold);font-size:clamp(26px,min(9vw,6vh),56px);padding:min(10px,1.3vh) 10px min(12px,1.5vh);border-radius:16px;line-height:1;border:3px solid var(--black);box-shadow:0 5px 0 var(--black)}
.fp-play:active{transform:translateY(4px);box-shadow:0 1px 0 var(--black)}
.fp-links{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fp-links button{background:var(--black);color:var(--gold);padding:12px 4px;font-size:clamp(15px,4.4vw,20px);border-radius:10px;border:2px solid var(--gold)}
.fp-resume{background:var(--cream);color:var(--red);border:2px solid var(--black);border-radius:12px;padding:10px;font-size:20px}
@media (orientation:landscape){
  #splash{flex-direction:row}
  .fp-panel{flex:0 0 min(46%,520px);display:flex;flex-direction:column;justify-content:center;border-top:none;border-left:5px solid var(--black);box-shadow:-4px 0 0 var(--gold),-12px 0 30px rgba(0,0,0,.4)}
  .fp-title b{font-size:clamp(30px,min(6.4vw,12vh),90px)}
  .fp-title small{font-size:clamp(18px,min(3.6vw,7vh),40px)}
  .fp-play{font-size:clamp(24px,min(4.6vw,9vh),52px)}
  .fp-body{padding:14px 24px}
}

/* ======= HOME ======= */
#home{min-height:100%;min-height:100dvh;display:flex;flex-direction:column;background:var(--red)}
.hhead{background:var(--black);padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(26px,7.4vw,36px);margin-bottom:10px;cursor:pointer;line-height:1.1}
.brand svg{width:34px;height:34px;flex:0 0 34px}
.pill{display:flex;background:var(--char);border-radius:30px;padding:3px;border:2px solid var(--gold);max-width:560px;margin:0 auto}
.pill button{flex:1 1 auto;padding:8px 2px;border-radius:24px;font-size:clamp(14px,4vw,18px);color:var(--gold);white-space:nowrap}
.pill button.on{background:var(--red);color:var(--cream);box-shadow:inset 0 0 0 2px var(--gold)}
.hbody{flex:1;padding:16px 14px calc(30px + env(safe-area-inset-bottom));max-width:620px;width:100%;margin:0 auto}
.gcard{background:var(--cream);border-radius:14px;padding:14px 16px;margin-bottom:14px;border:3px solid var(--black);box-shadow:0 0 0 2px var(--gold) inset}
.glabel{font-size:14px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;margin:14px 0 6px;font-weight:700}
.glabel:first-child{margin-top:0}
.seg2{display:flex;background:#fff;border:2px solid var(--black);border-radius:12px;overflow:hidden}
.seg2 button{flex:1;padding:10px 0 12px;font-family:var(--fd);font-weight:400;font-size:26px;border-right:2px solid var(--black)}
.seg2 button:last-child{border-right:none}
.seg2 button.on{background:var(--red);color:var(--cream);text-shadow:1.200px 0.000px 0 #121212, 0.971px 0.705px 0 #121212, 0.371px 1.141px 0 #121212, -0.371px 1.141px 0 #121212, -0.971px 0.705px 0 #121212, -1.200px 0.000px 0 #121212, -0.971px -0.705px 0 #121212, -0.371px -1.141px 0 #121212, 0.371px -1.141px 0 #121212, 0.971px -0.705px 0 #121212, 0 2px 0 #121212}
.sndset{margin-top:14px}.sndset summary{font-size:16px;color:var(--gold);text-transform:uppercase;font-weight:700;cursor:pointer}
.nextco{flex-basis:100%;text-align:center;margin-top:6px;padding:6px 8px;border-radius:10px;background:var(--black);border:2px solid var(--gold);color:var(--cream);font-size:17px;font-weight:700;letter-spacing:.5px}.nextco b{color:var(--gold);text-transform:uppercase}
.gnudge{margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;text-transform:uppercase;font-weight:700}
.gnudge button{min-width:40px;padding:6px 10px;border-radius:8px;background:var(--black);color:var(--gold);border:2px solid var(--goldd);font-size:16px}
.srow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}.srow span{flex:0 0 112px;text-transform:uppercase;font-weight:700;font-size:14px}
.srow input[type=range]{flex:1;accent-color:var(--gold);padding:0;border:none;background:none}.srow b{flex:0 0 40px;text-align:right}
.srow select{flex:1;min-width:0;padding:8px;border-radius:10px;background:#fff;color:var(--ink);border:2px solid var(--black);font-size:15px;font-weight:700}
.srow .sbtn{padding:8px 14px;border-radius:10px;background:var(--black);color:var(--gold);border:2px solid var(--gold);font-weight:700;text-transform:uppercase;font-size:14px}
.lrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:20px;text-transform:uppercase;font-weight:700}
.tog{width:56px;height:32px;border-radius:32px;background:#bbb;position:relative;flex:0 0 56px;border:2px solid var(--black)}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.tog.on{background:var(--red)}.tog.on::after{left:26px;background:var(--gold)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:40px;background:var(--black);color:var(--gold);border-radius:10px;font-size:24px}
.stepper b{min-width:40px;text-align:center;font-family:var(--fd);font-weight:400;font-size:28px}
.prow{display:flex;gap:8px;margin-bottom:8px;position:relative;transition:transform .15s}
.prow .grip{flex:0 0 40px;display:flex;align-items:center;justify-content:center;gap:2px;flex-direction:column;background:var(--black);color:var(--gold);border-radius:10px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;font-size:12px;line-height:1}
.prow .grip i{display:block;width:16px;height:2px;background:var(--gold);border-radius:1px;margin:1.5px 0}
.prow.drag{z-index:5;transition:none;box-shadow:0 8px 20px rgba(0,0,0,.45);transform:scale(1.03)}
.prow.drag input{outline:2px solid var(--gold)}
.prow input{text-transform:uppercase}
.prow .hsel{flex:0 0 84px;border-radius:10px;border:2px solid var(--black);background:var(--cream);color:var(--ink);font-family:var(--fd);font-size:18px;padding:0 4px;text-align:center}
.prow button{flex:0 0 46px;background:var(--black);color:var(--gold);border-radius:10px;font-size:24px}
.pastp{display:flex;flex-wrap:wrap;gap:8px}
#pastP{display:flex;flex-wrap:wrap;gap:8px}
#pastP button{background:var(--black);color:var(--cream);border:2px solid var(--goldd);border-radius:12px;padding:7px 11px;text-align:left;line-height:1.15;max-width:48%}
#pastP button b{display:block;color:var(--gold);text-transform:uppercase;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pastP button small{font-size:12px;opacity:.85}
.addp{width:100%;padding:10px;border:2px dashed var(--goldd);border-radius:10px;font-size:18px;color:var(--goldd)}
.cta{width:100%;background:var(--gold);color:var(--ink);font-family:var(--fd);font-weight:400;font-size:32px;padding:12px 10px 14px;border-radius:14px;margin-top:4px;border:3px solid var(--black);box-shadow:0 5px 0 var(--black);text-transform:uppercase}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--black)}
/* ======= TV SCOREBOARD (opened with ?tv=1) ======= */
.tvopen{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:10px 0 0;padding:10px;border-radius:12px;background:var(--gold);color:var(--ink);border:2px solid var(--black);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tvopen svg{width:24px;height:24px}
.tvopen .tvdot{width:10px;height:10px;border-radius:50%;background:var(--mute);margin-left:4px}.tvopen .tvdot.on{background:#2fa84f}.tvopen .tvdot.wait{background:#e0a020}
.tvpair{text-align:left;font-size:16px;line-height:1.4}
.tvpair ol{margin:0 0 10px;padding-left:22px}.tvpair li{margin:0 0 8px}
.tvpair .tvurl{display:block;font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--cream2);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;margin-top:4px;word-break:break-all;user-select:all;-webkit-user-select:all}
.tvpair .tvcode{display:flex;gap:8px;margin-top:6px}
.tvpair input{flex:1;min-width:0;font-size:28px;letter-spacing:.2em;text-align:center;padding:6px;border:2px solid var(--black);border-radius:10px;background:#fff;color:var(--ink);font-family:var(--fd)}
.tvpair .tvgo{padding:6px 14px;border-radius:10px;background:var(--red);color:var(--cream);border:2px solid var(--black);font-size:18px;font-weight:700}
.tvpair .tvstate{margin:4px 0 10px;padding:8px 10px;border-radius:10px;background:var(--cream2);font-weight:700}

<script>
(function(){
var P='oche.',TOPIC='jimsbar-tv/',CHAN='jimsbar-tv',RELAYS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://mqtt.eclipseprojects.io/mqtt'];
function $(id){return document.getElementById(id)}
function diag(m){var d=$('tvDiag');if(d){d.style.display='block';d.textContent=String(m).slice(0,400)}}
window.onerror=function(m,src,line){diag('Error: '+m+' (line '+line+')');};
function lsGet(k,d){try{var v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}}
try{var o=JSON.parse(localStorage.getItem(P+'relays'));if(o&&o.length)RELAYS=o}catch(e){}
function enc(str){var u=unescape(encodeURIComponent(str)),a=new Uint8Array(u.length);for(var i=0;i<u.length;i++)a[i]=u.charCodeAt(i);return a}
function dec(b){var x='';for(var i=0;i<b.length;i+=4096)x+=String.fromCharCode.apply(null,Array.prototype.slice.call(b.subarray(i,i+4096)));try{return decodeURIComponent(escape(x))}catch(e){return x}}
function cat(list){var n=0,i;for(i=0;i<list.length;i++)n+=list[i].length;var u=new Uint8Array(n),off=0;for(i=0;i<list.length;i++){u.set(list[i],off);off+=list[i].length}return u}
function mstr(str){var b=enc(str),u=new Uint8Array(b.length+2);u[0]=b.length>>8;u[1]=b.length&255;u.set(b,2);return u}
function packet(h,body){var len=[h],n=body.length;do{var d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d)}while(n>0);return cat([new Uint8Array(len),body])}
function short(url){var m=/\/\/([^.\/:]+\.)?([^.\/:]+)\./.exec(url);var h=(m&&m[2])||url;return h==='hivemq'?'HiveMQ':h==='emqx'?'EMQX':h==='eclipseprojects'?'Eclipse':h}

function Relay(url,topics,onMsg,onState){this.url=url;this.topics=topics;this.onMsg=onMsg;this.onState=onState;this.ok=false;this.wait=0;this.rx=0;this.st='connecting';this.pid=1;this.open()}
Relay.prototype.open=function(){var me=this,ws;if(me.ws)return;
  try{ws=new WebSocket(me.url,'mqtt')}catch(e){me.st='blocked';me.onState();me.retry();return}
  me.ws=ws;ws.binaryType='arraybuffer';me.buf=new Uint8Array(0);me.ok=false;me.st='connecting';
  var to=setTimeout(function(){if(me.ws===ws&&!me.ok){me.st='no answer';me.drop()}},10000);
  ws.onopen=function(){var id='tv'+Math.random().toString(36).slice(2,12);ws.send(packet(0x10,cat([mstr('MQTT'),new Uint8Array([4,2,0,45]),mstr(id)])))};
  ws.onmessage=function(e){if(me.ws===ws)me.data(new Uint8Array(e.data))};
  ws.onerror=ws.onclose=function(){clearTimeout(to);if(me.ws===ws){if(me.st==='connecting')me.st='failed';me.drop()}}};
Relay.prototype.drop=function(){var ws=this.ws;this.ws=null;this.ok=false;clearInterval(this.ping);try{ws&&ws.close()}catch(e){}if(this.st==='online')this.st='reconnecting';this.onState();this.retry()};
Relay.prototype.retry=function(){var me=this;clearTimeout(me.rt);me.wait=Math.min(me.wait?me.wait*2:1000,30000);me.rt=setTimeout(function(){me.open()},me.wait)};
Relay.prototype.kick=function(){if(!this.ws){clearTimeout(this.rt);this.wait=0;this.open()}};
Relay.prototype.send=function(u){try{this.ws.send(u)}catch(e){}};

  if(d.type==='180'){el.className='fx f180';el.innerHTML='<div class="rays"></div><div class="big ol">180</div><div class="sub">'+nm+'</div>';confetti(el,70);dur=3800}
  else if(d.type==='ton'){el.className='fx fton';el.innerHTML='<div class="lt"><b>'+d.value+'</b><span>'+nm+'</span></div>';dur=2600}
  else if(d.type==='bull'){el.className='fx fton';el.innerHTML='<div class="lt"><b>FIRST</b><span>'+nm+' THROWS FIRST</span></div>';dur=3000}
  else if(d.type==='bust'){el.className='fx fbust';el.innerHTML='<div class="bb">BUST</div><div class="bn">'+nm+'</div>';dur=1500}
  else if(d.type==='gameshot'){var hi=d.value>=100,lvl=d.level;
    el.className='fx fgs'+(hi?' hi':'')+' l-'+lvl;
    el.innerHTML='<div class="band"></div><div class="gsin"><small>'+(lvl==='match'?'GAME SHOT AND THE MATCH':lvl==='set'?'GAME SHOT AND THE SET':'GAME SHOT')+'</small><b class="ol">'+nm+'</b><div class="co">'+(hi?'<span class="tonco">'+d.value+'</span> CHECKOUT':'CHECKOUT '+d.value)+'<em>'+esc((d.darts||[]).join('  '))+'</em></div></div>';
    if(lvl!=='leg'||hi)confetti(el,lvl==='match'?110:60);dur=lvl==='match'?5200:4300;
    var sd=d;clearTimeout(S.statsT);S.statsT=setTimeout(function(){showStats(sd)},dur-200)}
  else return;
  S.animUntil=Date.now()+dur;box.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},dur+100)}
// ---------- stats between legs ----------
function showStats(d){var P=d.stats||[];if(!P.length||S.pre)return;var n=P.length,el=$('stats'),i,j;
  var rows=[['avg','THREE-DART AVERAGE',1],['legAvg','AVERAGE THIS LEG',1],['b180','180s',0],['b140','140+',0],['b100','100+',0],['co','CHECKOUT %',0],['hi','HIGHEST CHECKOUT',0]];
  if(d.sets)rows.unshift(['sets','SETS',0]);rows.unshift(['legs','LEGS WON',0]);
  var h='<div class="stc"><div class="sth"><small>'+esc(d.title)+'</small>'+(d.level==='match'?'<b class="ol">'+esc(d.name).toUpperCase()+' WINS</b>':'')+'</div>';
  if(n===2){h+='<div class="stn"><span>'+esc(P[0].name)+'</span><span>'+esc(P[1].name)+'</span></div>';
    for(i=0;i<rows.length;i++){var k=rows[i][0],a=P[0][k],b=P[1][k],fa=a==null?'-':(rows[i][2]?a.toFixed(1):a)+(k==='co'&&a!=null?'%':''),fb=b==null?'-':(rows[i][2]?b.toFixed(1):b)+(k==='co'&&b!=null?'%':'');
      var mx=Math.max(a||0,b||0)||1;
      h+='<div class="str"><span class="v'+((a||0)>(b||0)?' best':'')+'">'+fa+'</span><span class="bar l"><i style="width:'+Math.round((a||0)/mx*100)+'%"></i></span><span class="lab">'+rows[i][1]+'</span><span class="bar r"><i style="width:'+Math.round((b||0)/mx*100)+'%"></i></span><span class="v'+((b||0)>(a||0)?' best':'')+'">'+fb+'</span></div>'}}
  else{h+='<table class="stt"><tr><td></td>';for(j=0;j<n;j++)h+='<th>'+esc(P[j].name)+'</th>';h+='</tr>';
    for(i=0;i<rows.length;i++){var kk=rows[i][0],best=-1,bi=-1;for(j=0;j<n;j++){if((P[j][kk]||0)>best){best=P[j][kk]||0;bi=j}}
      h+='<tr><td class="lab">'+rows[i][1]+'</td>';for(j=0;j<n;j++){var vv=P[j][kk];h+='<td'+(j===bi&&best>0?' class="best"':'')+'>'+(vv==null?'-':(rows[i][2]?vv.toFixed(1):vv)+(kk==='co'?'%':''))+'</td>'}h+='</tr>'}h+='</table>'}
  el.innerHTML=h+'</div>';el.className='';clearTimeout(S.statsT2);S.statsT2=setTimeout(hideStats,d.level==='match'?30000:11000)}
function hideStats(){clearTimeout(S.statsT2);var el=$('stats');if(el&&el.className!=='hidden')el.className='hidden'}
function fit(){var st=$('tvStage');var tf='translate(-50%,-50%)';st.style.transform=st.style.webkitTransform=tf;var w=st.offsetWidth,h=st.offsetHeight;if(!w||!h)return;
  var k=Math.min(window.innerWidth*0.97/w,window.innerHeight*0.96/h);tf+=' scale('+k+')';st.style.transform=st.style.webkitTransform=tf}
function call(text){if(/\bbc\b/.test($('tvStage').className))return;if(Date.now()<S.animUntil+800&&/^(one hundred|game shot|bust)|checkout!?$/i.test(text))return;S.calls.push(text);if(S.calls.length>2)S.calls.splice(0,S.calls.length-2);if(!S.callT)nextCall()}
function nextCall(){var el=$('tvCall'),wait=S.animUntil-Date.now();if(wait>0&&S.calls.length){el.className='hidden';S.callT=setTimeout(nextCall,wait+100);return}var t=S.calls.shift();if(t==null){el.className='hidden';S.callT=0;return}
  el.textContent=t.replace(/[!.]+$/,'');el.className=/one hundred and eighty|game shot|killer!|shanghai|is out|wins/i.test(t)?'big':'';
  S.callT=setTimeout(nextCall,S.calls.length?1300:2600)}
window.addEventListener('resize',fit);
if(window.WebSocket){for(var i=0;i<RELAYS.length;i++)S.relays.push(new Relay(RELAYS[i],[TOPIC+code,TOPIC+code+'/c'],function(t,p){try{got(JSON.parse(p))}catch(e){}},state))}
state();setInterval(state,4000);
// ---------- caller voice on the TV ----------
// TV browsers only allow sound after a button press on the page, so the first OK/click turns it on.
var V={has:!!(window.speechSynthesis&&window.SpeechSynthesisUtterance),ready:false,works:null,testing:false,why:'',nv:0,q:[],cur:null,wd:0,voice:null,want:false};
function pickV(){try{var vs=speechSynthesis.getVoices(),i;for(i=0;i<vs.length;i++)if(/en[-_]GB/i.test(vs[i].lang)){V.voice=vs[i];return}for(i=0;i<vs.length;i++)if(/^en/i.test(vs[i].lang)){V.voice=vs[i];return}}catch(e){}}
if(V.has){pickV();try{speechSynthesis.onvoiceschanged=pickV}catch(e){}}
function voiceStatus(){var j=JSON.stringify({speech:V.has&&V.works!==false,ready:V.ready&&V.works===true,why:V.why||'',voices:V.nv,t:Date.now()});for(var i=0;i<S.relays.length;i++)S.relays[i].pub(TOPIC+code+'/s',j,true);voiceUI()}
setInterval(voiceStatus,60000);
function voiceUI(){var b=$('tvSound'),l=$('tvVoiceLine'),t=!V.has?"Caller voice: this TV's browser has no speech, so the caller plays on the phone or iPad":
  V.works===false?"Caller voice: this TV's browser didn't make a sound ("+V.why+"), so the caller plays on the phone or iPad. Press OK to try again.":
  V.testing?'Caller voice: testing...':V.works===true?'Caller voice: on (sound from this TV)':'Caller voice: press OK on the remote to turn the sound on';
  if(l)l.textContent=t;if(b){b.textContent=V.works===false?'Press OK to try the TV voice again':"Press OK for the caller's voice";b.className=(V.has&&!V.testing&&V.works!==true&&V.want)?'':'hidden'}}
// pressing OK turns the sound on and says a test line; if the browser never actually starts speaking (some TVs have
// the feature but no voices), the TV reports that and the scorer keeps the caller on the phone or iPad
function activate(){if(!V.has||V.testing||V.works===true)return;V.ready=true;V.testing=true;V.works=null;pickV();
  try{V.nv=speechSynthesis.getVoices().length}catch(e){V.nv=0}
  var started=0,ended=0,t0=Date.now(),u;voiceUI();
  try{try{speechSynthesis.cancel()}catch(e){}u=new SpeechSynthesisUtterance('Caller voice on.');if(V.voice)u.voice=V.voice;u.lang=V.voice?V.voice.lang:'en-GB';u.volume=1;
    u.onstart=function(){started=Date.now()};u.onend=function(){ended=Date.now();check()};u.onerror=function(e){V.why='error '+(e&&e.error||'');fail()};
    speechSynthesis.speak(u)}catch(e){V.why='error';fail();return}
  var tm=setTimeout(function(){if(!started){V.why=V.nv?'no sound started':'no voices installed';fail()}else check(true)},5000);
  function check(timeout){if(!V.testing)return;clearTimeout(tm);var dur=(ended||Date.now())-(started||t0);
    if(started&&(dur>=350||timeout)){V.works=true;V.testing=false;V.why='';voiceStatus()}else{V.why=V.nv?'finished instantly, no sound':'no voices installed';fail()}}
  function fail(){clearTimeout(tm);V.works=false;V.testing=false;V.ready=false;try{speechSynthesis.cancel()}catch(e){}voiceStatus()}}
document.addEventListener('keydown',function(e){activate()},true);document.addEventListener('click',activate,true);document.addEventListener('touchstart',activate,true);
$('tvSound').onclick=activate;try{$('tvSound').focus()}catch(e){}
function speak(d){if(!V.has)return;if(V.works!==true){V.want=true;voiceUI();return}var now=Date.now(),k=[];for(var i=0;i<V.q.length;i++){var x=V.q[i];if(!(x.dart&&(d.dart||now-x.ts>2500)))k.push(x)}
  V.q=k;if(V.q.length>6)V.q.splice(0,V.q.length-6);V.q.push({text:d.text,dart:d.dart,rate:d.rate,pitch:d.pitch,vol:d.vol,ts:now});vNext()}
function vNext(){if(V.cur||!V.q.length)return;var it=V.q.shift();if(Date.now()-it.ts>(it.dart?3000:9000))return vNext();
  try{if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){}
  try{var u=new SpeechSynthesisUtterance(it.text);if(!V.voice)pickV();if(V.voice)u.voice=V.voice;u.lang=V.voice?V.voice.lang:'en-GB';u.rate=it.rate||1.02;u.pitch=it.pitch||1;u.volume=Math.max(0,Math.min(1,(it.vol==null?100:it.vol)/100));
    var fin=function(){if(V.cur!==u)return;V.cur=null;clearTimeout(V.wd);setTimeout(vNext,30)};u.onend=fin;u.onerror=fin;V.cur=u;clearTimeout(V.wd);
    V.wd=setTimeout(function(){if(V.cur===u){try{speechSynthesis.cancel()}catch(e){}V.cur=null;vNext()}},2500+it.text.length*120);speechSynthesis.speak(u)}catch(e){V.cur=null}}
voiceUI();
window.addEventListener('online',function(){for(var i=0;i<S.relays.length;i++)S.relays[i].kick()});
// same device (laptop / iPad window): local channel and storage too
try{if(window.BroadcastChannel){var bc=new BroadcastChannel(CHAN);bc.onmessage=function(e){got(e.data)};bc.postMessage({k:'hello'})}}catch(e){}
window.addEventListener('storage',function(e){if(e.key===P+'tv'||e.key===P+'tvcall'){try{got(JSON.parse(e.newValue))}catch(x){}}
  else if(e.key===P+'theme'){try{document.documentElement.setAttribute('data-theme',JSON.parse(e.newValue))}catch(x){}}});
$('tvFull').onclick=function(){var el=document.documentElement;try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}};
window.addEventListener('mousemove',function(){tv.className=tv.className.replace(/\s*mouse/,'')+' mouse';clearTimeout(S.mouseT);S.mouseT=setTimeout(function(){tv.className=tv.className.replace(/\s*mouse/,'')},2500)});
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
$('tvUA').textContent='Version 2.9.1 \u00b7 '+navigator.userAgent;
// new version: the TV can't be tapped, so it reloads itself as soon as it's idle (between games)
var VER='2.9.1',upd=null;
function vnum(v){var a=String(v||'').split('.'),o=[];for(var i=0;i<a.length;i++)o.push(parseInt(a[i],10)||0);return o}
function vnewer(a,b){var x=vnum(a),y=vnum(b),n=Math.max(x.length,y.length);for(var i=0;i<n;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false}
function updGo(){if(upd&&/\bidle\b/.test(tv.className))location.replace(location.pathname+'?tv='+code+'&v='+encodeURIComponent(upd))}
function updCheck(){if(!/^https?:/.test(location.protocol))return;try{var x=new XMLHttpRequest();x.open('GET','version.json?c='+Date.now(),true);
  x.onload=function(){try{var j=JSON.parse(x.responseText);if(j&&j.version&&vnewer(j.version,VER)){upd=String(j.version);updGo()}}catch(e){}};x.send()}catch(e){}}
setTimeout(updCheck,15000);setInterval(updCheck,5*60000);setInterval(updGo,20000);
})();
